<!DOCTYPE html>
<html>
<head>
    <title>College Management System</title>
<link
rel="stylesheet"
href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<h2>Login</h2>

<form method="POST">

<label>Username</label>

<input
type="text"
name="username"
required>

<br><br>

<label>Password</label>

<input
type="password"
name="password"
required>

<br><br>

<button type="submit">

Login

</button>

</form>

{% if error %}

<p style="color:red">

{{ error }}

</p>

{% endif %}

</body>
</html>
