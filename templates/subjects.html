<!DOCTYPE html>
<html>

<head>
<title>Subjects</title>
<link
rel="stylesheet"
href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<h1>Subject Management</h1>

<a href="/dashboard">Dashboard</a> |

<a href="/add_subject">Add Subject</a>
<br><br>

<form action="/search_subject" method="GET">

<input
type="text"
name="search"
placeholder="Search by Code or Subject Name">

<button type="submit">

Search

</button>

</form>

<br>
<br><br>

<table border="1" cellpadding="10">

<tr>

<th>ID</th>
<th>Code</th>
<th>Name</th>
<th>Department</th>
<th>Semester</th>
<th>Faculty</th>
<th>Action</th>

</tr>

{% for subject in subjects %}

<tr>

<td>{{ subject[0] }}</td>
<td>{{ subject[1] }}</td>
<td>{{ subject[2] }}</td>
<td>{{ subject[3] }}</td>
<td>{{ subject[4] }}</td>
<td>{{ subject[5] }}</td>

<td>

<a href="/edit_subject/{{ subject[0] }}">Edit</a>

|

<a href="/delete_subject/{{ subject[0] }}">Delete</a>

</td>

</tr>

{% endfor %}

</table>

</body>

</html>
