<!DOCTYPE html>

<html>

<head>

<title>Fee Report</title>
<link
rel="stylesheet"
href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<h1>Fee Report</h1>
<form action="/search_fee" method="GET">

<input
type="text"
name="search"
placeholder="Search Student">

<button type="submit">

Search

</button>

</form>

<br>

<a href="/fees">

Add Fee

</a>

<br><br>

<table border="1" cellpadding="10">

<tr>

<th>ID</th>

<th>Student</th>

<th>Total Fee</th>

<th>Paid</th>

<th>Pending</th>

<th>Payment Date</th>

<th>Status</th>

</tr>

{% for row in records %}

<tr>

<td>{{ row[0] }}</td>

<td>{{ row[1] }}</td>

<td>{{ row[2] }}</td>

<td>{{ row[3] }}</td>

<td>{{ row[4] }}</td>

<td>{{ row[5] }}</td>

<td>

{% if row[4]==0 %}

Paid

{% else %}

Pending

{% endif %}

</td>

</tr>

{% endfor %}

</table>

</body>

</html>
